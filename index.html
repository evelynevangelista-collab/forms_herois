<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Academia dos Heróis</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    
    <body>
        <header>
            <h1>Academia de Heróis</h1>
            <p class="texto_pequeno">Inscreva-se para participar da próxima missão.</p>
        </header>
        <main>
            <section class="card">
                <h2>Faça sua Inscrição</h2>
                
                <form action="#" method="get"></form>
                <label for="nome">Nome do Herói:</label>
                <input id="nome" name="nome" type="text" />


                <label for="email">E-mail:</label>
                <input id="email" name="email" type="email" />


                <label for="idade">Idade:</label>
                <input id="idade" name="idade" type="number" />


                <label for="equipes">Escolha sua Equipe</label>
                <select id="equipes" name="equipes">
                    <option>Liga da Justiça</option>
                    <option>Vingadores</option>
                    <option>X-Men</option>
                    <option>Quarteto Fantástico</option>
                    <option>Eternos</option>
                </select>
                <article>
                <h3>Qual poder você prefere?</h3>
                <input id="voar" name="poder" type="radio" />
                <label for="voar">Voar</label>

                <input id="supervelocidade" name="poder" type="radio" />
                <label for="supervelocidade">Supervelocidade</label>


                <input id="superforca" name="poder" type="radio" />
                <label for="superforca">Superforça</label>


                <input id="missoes" name="missoes" type="checkbox" />
                <label for="missoes">Quero receber novas missões.</label>
            </article>
            <article>
                <label for="motivo">Porque você quer ser um herói?</label>
                <textarea id="motivo" name="motivo" rows="4"></textarea>
            </article>
        </section>

        <button type="submit">Enviar Inscrição</button>
    </form>
</main>
<footer>
    <p>Prática de formulários HTML.</p>
</footer>
</body>
</html>
